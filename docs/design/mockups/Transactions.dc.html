<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guldr — Transactions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#E6E2DA;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif}
a{color:#8A6A2E}a:hover{color:#6E5424}
</style>
</helmet>
<div style="width: 908px; height: 964px; box-sizing: border-box; padding: 40px; display: flex; gap: 48px; background: #E6E2DA">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="width: 390px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5E5950">{{t.name}}</div>
<div style="width: 390px; height: 844px; box-sizing: border-box; border-radius: 52px; overflow: hidden; position: relative; background: {{t.bg}}; border: 1px solid {{t.frame}}; color: {{t.text}}">
<div style="padding: 64px 20px 0; display: flex; flex-direction: column; gap: 12px">

<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; color: {{t.text}}">Transactions</h1>

<label style="height: 40px; border-radius: 12px; background: {{t.surface2}}; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: {{t.text2}}">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="{{t.ic.search}}"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search transactions</span>
<input type="search" placeholder="Search" style="flex-grow: 1; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: {{t.text}}">
</label>

<div role="group" aria-label="Filter" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: {{t.surface2}}">
<button style="height: 32px; border: none; border-radius: 9px; background: {{t.surface}}; box-shadow: {{t.shadow}}; font: inherit; font-size: 14px; font-weight: 600; color: {{t.text}}">All</button>
<button style="height: 32px; border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: {{t.text2}}">Income</button>
<button style="height: 32px; border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: {{t.text2}}">Expenses</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{t.sections}}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; padding: 8px 2px 4px; font-size: 13px; font-weight: 600; color: {{s.c.text2}}"><span>{{s.label}}</span><span style="font-weight: 500; font-variant-numeric: tabular-nums">{{s.total}}</span></div>
<sc-for list="{{s.rows}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 7px 2px">
<div style="width: 40px; height: 40px; border-radius: 12px; background: {{r.c.surface2}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{r.c.text}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
<div style="font-size: 16px; font-weight: 600; color: {{r.c.text}}">{{r.title}}</div>
<div style="font-size: 13px; color: {{r.c.text2}}">{{r.meta}}</div>
</div>
<div style="font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{r.amountColor}}">{{r.amount}}</div>
</div>
</sc-for>
</div>
</sc-for>
</div>

</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; gap: 10px; align-items: center">
<nav aria-label="Main" style="flex-grow: 1; height: 64px; box-sizing: border-box; border-radius: 32px; background: {{t.glass}}; border: 1px solid {{t.glassLine}}; box-shadow: {{t.shadow}}; display: flex; justify-content: space-between; align-items: center; padding: 0 6px">
<sc-for list="{{t.tabs}}" as="tab" hint-placeholder-count="4">
<a href="{{tab.href}}" style="flex-grow: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{tab.color}}; background: {{tab.bg}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.icon}}"></path></svg>
<span style="font-size: 10px; font-weight: 600">{{tab.label}}</span>
</a>
</sc-for>
</nav>
<a href="AddTransaction.dc.html" aria-label="Add transaction" style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 32px; background: {{t.goldFill}}; color: #111111; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{t.ic.plus}}"></path></svg>
</a>
</div>

</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":908,"height":964}}'>
class Component extends DCLogic {
  renderVals() {
    const icons = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
      list: 'M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01',
      budget: 'M12 3a9 9 0 1 0 9 9M12 3v9h9',
      charts: 'M5 20V11M12 20V5M19 20v-6M3 20h18',
      plus: 'M12 5v14M5 12h14',
      search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4',
      food: 'M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 3-3 6v4h3',
      salary: 'M4 8h16v11H4zM9 8V5h6v3M4 13h16',
      car: 'M5 16h14M6 16l1.5-5h9L18 16M7 16v2M17 16v2',
      health: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z',
      play: 'M8 5v14l11-7z',
      coffee: 'M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3v3M12 3v3'
    };
    const TH = [
      { name: 'Light', bg: '#F7F4EE', surface: '#FFFFFF', surface2: '#EFEAE0', text: '#141312', text2: '#6B665E', line: '#E3DDD1', gold: '#8A6A2E', goldFill: '#C8A96A', pos: '#2F7D5B', neg: '#B4443C', glass: 'rgba(255,255,255,0.82)', glassLine: 'rgba(20,19,18,0.08)', frame: '#D8D3C9', shadow: '0 1px 2px rgba(20,19,18,0.06), 0 6px 16px rgba(20,19,18,0.06)', track: '#EFEAE0', tabOn: 'rgba(20,19,18,0.06)' },
      { name: 'Dark', bg: '#111111', surface: '#2E2C29', surface2: '#1F1E1C', text: '#F2EEE6', text2: '#9C968C', line: '#2C2A27', gold: '#C8A96A', goldFill: '#C8A96A', pos: '#5FB38A', neg: '#E07A6E', glass: 'rgba(40,38,36,0.82)', glassLine: 'rgba(242,238,230,0.10)', frame: '#2A2826', shadow: 'none', track: '#2C2A27', tabOn: 'rgba(242,238,230,0.08)' }
    ];
    const tabDefs = [
      ['Home', icons.home, 'Dashboard.dc.html'], ['Transactions', icons.list, 'Transactions.dc.html'],
      ['Budget', icons.budget, 'Budget.dc.html'], ['Analytics', icons.charts, 'Charts.dc.html']
    ];
    const active = 1;
    const data = [
      { label: 'Today', total: '−$47.30', rows: [
        { title: 'Groceries', meta: 'Food · 9:41', amount: '−$42.80', icon: icons.food },
        { title: 'Coffee', meta: 'Food · 8:15', amount: '−$4.50', icon: icons.coffee } ] },
      { label: 'Yesterday', total: '−$34.24', rows: [
        { title: 'Pharmacy', meta: 'Health · 18:20', amount: '−$18.25', icon: icons.health },
        { title: 'Streaming subscription', meta: 'Entertainment', amount: '−$15.99', icon: icons.play } ] },
      { label: 'Thursday, Sep 25', total: '+$5,000.00', rows: [
        { title: 'Salary', meta: 'Salary · Monthly', amount: '+$5,000.00', icon: icons.salary, income: true } ] },
      { label: 'Wednesday, Sep 24', total: '−$35.00', rows: [
        { title: 'Gas', meta: 'Transport · 7:50', amount: '−$35.00', icon: icons.car } ] }
    ];
    const themes = TH.map((t) => ({
      ...t, ic: icons,
      tabs: tabDefs.map(([label, icon, href], i) => ({ label, icon, href, color: i === active ? t.gold : t.text2, bg: i === active ? t.tabOn : 'transparent' })),
      sections: data.map((s) => ({ ...s, c: t, rows: s.rows.map((r) => ({ ...r, c: t, amountColor: r.income ? t.pos : t.text })) }))
    }));
    return { themes };
  }
}
</script>
</body>
</html>
