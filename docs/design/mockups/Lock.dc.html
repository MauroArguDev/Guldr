<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guldr — Lock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&amp;display=swap">
<style>
body{margin:0;background:#E6E2DA;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif}
a{color:#8A6A2E}a:hover{color:#6E5424}
</style>
</helmet>
<div style="width: 908px; height: 964px; box-sizing: border-box; padding: 40px; display: flex; gap: 48px; background: #E6E2DA">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="width: 390px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5E5950">{{t.name}}</div>
<div style="width: 390px; height: 844px; box-sizing: border-box; border-radius: 52px; overflow: hidden; position: relative; background: {{t.bg}}; border: 1px solid {{t.frame}}; color: {{t.text}}; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 220px 32px 56px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
<svg width="84" height="84" viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="228" fill="{{t.iconBg}}" stroke="{{t.iconLine}}" stroke-width="8"></rect><path d="M703.5 351.3 A250 250 0 1 0 762 512 L 548 512" fill="none" stroke="{{t.gold}}" stroke-width="84"></path></svg>
<div style="font-family: Manrope, -apple-system, sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.045em; line-height: 1">guldr</div>
<div style="font-size: 16px; color: {{t.text2}}; text-align: center; line-height: 1.45">Your finances, just for you.</div>
</div>

<div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px">
<div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px">
<div style="height: 1px; width: 100%; background: {{t.goldFill}}; opacity: 0.6"></div>
<div style="height: 1px; width: 70%; background: {{t.goldFill}}; opacity: 0.35"></div>
<div style="height: 1px; width: 40%; background: {{t.goldFill}}; opacity: 0.18"></div>
</div>
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M9 9v1.5M15 9v1.5M12 9v4h-1M9 16c1.8 1.3 4.2 1.3 6 0"></path></svg>
<a href="Dashboard.dc.html" style="width: 100%; height: 54px; border-radius: 27px; background: {{t.goldFill}}; color: #111111; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Unlock with Face ID</a>
<button style="border: none; background: transparent; font: inherit; font-size: 16px; font-weight: 500; color: {{t.gold}}; height: 44px; padding: 0 12px">Use iPhone passcode</button>
</div>

</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":908,"height":964}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      themes: [
        { name: 'Light', bg: '#F7F4EE', text: '#141312', text2: '#6B665E', gold: '#8A6A2E', goldFill: '#C8A96A', frame: '#D8D3C9', iconBg: '#FFFFFF', iconLine: '#E3DDD1' },
        { name: 'Dark', bg: '#111111', text: '#F2EEE6', text2: '#9C968C', gold: '#C8A96A', goldFill: '#C8A96A', frame: '#2A2826', iconBg: '#1B1A18', iconLine: '#2C2A27' }
      ]
    };
  }
}
</script>
</body>
</html>
