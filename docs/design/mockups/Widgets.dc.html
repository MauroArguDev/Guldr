<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guldr — Widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#E6E2DA;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif}
a{color:#8A6A2E}a:hover{color:#6E5424}
</style>
</helmet>
<div style="width: 908px; height: 620px; box-sizing: border-box; padding: 40px; display: flex; gap: 48px; background: #E6E2DA">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="width: 390px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5E5950">{{t.name}}</div>
<div style="width: 390px; height: 500px; box-sizing: border-box; border-radius: 40px; background: {{t.wall}}; padding: 26px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; gap: 22px; align-items: flex-start">
<div style="width: 158px; height: 158px; box-sizing: border-box; border-radius: 26px; background: {{t.w}}; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; color: {{t.text}}">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 12px; font-weight: 600; color: {{t.text2}}">Balance</span>
<svg width="18" height="18" viewBox="0 0 1024 1024" aria-hidden="true"><path d="M703.5 351.3 A250 250 0 1 0 762 512 L 548 512" fill="none" stroke="{{t.gold}}" stroke-width="110"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: ui-serif, 'New York', 'Iowan Old Style', Georgia, serif; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums">$12,480</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="height: 1px; background: {{t.goldFill}}"></div>
<div style="height: 1px; width: 70%; background: {{t.goldFill}}; opacity: 0.45"></div>
</div>
<div style="font-size: 12px; color: {{t.text2}}; font-variant-numeric: tabular-nums">Sep: −$1,759.50</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, 68px); gap: 22px 22px">
<sc-for list="{{t.apps}}" as="a" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 60px; height: 60px; border-radius: 15px; background: {{a.bg}}"></div>
<div style="width: 40px; height: 6px; border-radius: 3px; background: {{a.label}}"></div>
</div>
</sc-for>
</div>
</div>

<div style="width: 338px; height: 158px; box-sizing: border-box; border-radius: 26px; background: {{t.w}}; padding: 16px; display: flex; gap: 16px; color: {{t.text}}">
<div style="width: 128px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 1024 1024" aria-hidden="true"><path d="M703.5 351.3 A250 250 0 1 0 762 512 L 548 512" fill="none" stroke="{{t.gold}}" stroke-width="110"></path></svg>
<span style="font-size: 12px; font-weight: 600; color: {{t.text2}}">Balance</span>
</div>
<div style="font-family: ui-serif, 'New York', 'Iowan Old Style', Georgia, serif; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums">$12,480</div>
<div style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-variant-numeric: tabular-nums">
<span style="color: {{t.pos}}">↑ $5,000.00</span>
<span style="color: {{t.neg}}">↓ $1,759.50</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding-left: 14px; border-left: 1px solid {{t.line}}">
<sc-for list="{{t.recent}}" as="r" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 13px; font-weight: 600; color: {{r.c.text}}">{{r.title}}</span>
<span style="font-size: 11px; color: {{r.c.text2}}">{{r.meta}}</span>
</div>
<span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{r.color}}">{{r.amount}}</span>
</div>
</sc-for>
</div>
</div>

</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":908,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = [
      { name: 'Light', wall: '#D6CFC2', w: '#FFFFFF', text: '#141312', text2: '#6B665E', line: '#E3DDD1', gold: '#8A6A2E', goldFill: '#C8A96A', pos: '#2F7D5B', neg: '#B4443C', appBg: 'rgba(255,255,255,0.55)', appLabel: 'rgba(20,19,18,0.18)' },
      { name: 'Dark', wall: '#1E1D1B', w: '#111111', text: '#F2EEE6', text2: '#9C968C', line: '#2C2A27', gold: '#C8A96A', goldFill: '#C8A96A', pos: '#5FB38A', neg: '#E07A6E', appBg: 'rgba(242,238,230,0.10)', appLabel: 'rgba(242,238,230,0.16)' }
    ];
    const recent = [
      { title: 'Groceries', meta: 'Today', amount: '−$42.80' },
      { title: 'Salary', meta: 'Sep 25', amount: '+$5,000', income: true },
      { title: 'Gas', meta: 'Sep 24', amount: '−$35.00' }
    ];
    const themes = TH.map((t) => ({
      ...t,
      apps: [0, 1, 2, 3].map(() => ({ bg: t.appBg, label: t.appLabel })),
      recent: recent.map((r) => ({ ...r, c: t, color: r.income ? t.pos : t.text }))
    }));
    return { themes };
  }
}
</script>
</body>
</html>
