name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_VERSION: "26.6"
  SIMULATOR_NAME: "iPhone 17"
  NSUnbufferedIO: "YES"
  # Swift packages are resolved here instead of inside DerivedData, so both macOS jobs can restore
  # them from the cache. The cache key (repeated in each cache step, since hashFiles only works in
  # steps) changes with Xcode and with either Package.resolved.
  SOURCE_PACKAGES: SourcePackages

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull requests that only touch Markdown or docs/ skip the macOS job. A job skipped
      # by its condition reports success, so the required `test` check is still satisfied.
      # Pushes to main and manual runs always test.
      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Domain package tests on macOS, no simulator (ADR 006), SwiftLint in strict mode over the whole
  # repository, and the Release build. The job id is a required status check in the main ruleset.
  core-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Run GuldrCore tests
        run: |
          set -o pipefail
          swift test --package-path Packages/GuldrCore 2>&1 | tee core-tests.log

      # Guards against a green check that ran nothing.
      - name: Verify tests ran
        run: |
          set -euo pipefail
          total="$(grep -oE 'Test run with [0-9]+ tests?' core-tests.log | tail -1 | grep -oE '[0-9]+' || echo 0)"
          {
            echo "### GuldrCore tests"
            echo "Tests run: $total"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -eq 0 ]; then
            echo "::error::No GuldrCore tests were executed."
            exit 1
          fi

      # Uses the SwiftLint binary pinned by the package (same version as the Xcode plugin).
      # --strict turns every warning into an error, enforcing zero warnings in CI.
      - name: SwiftLint (strict)
        run: |
          set -euo pipefail
          swiftlint="Packages/GuldrCore/.build/artifacts/swiftlintplugins/SwiftLintBinary/SwiftLintBinary.artifactbundle/macos/swiftlint"
          "$swiftlint" version
          "$swiftlint" lint --strict --quiet --reporter github-actions-logging

      # Restored only after linting, although SwiftLint's included folders leave it out anyway.
      # A changed Package.resolved changes the key, so new pins never reuse old checkouts.
      - name: Restore Swift packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SOURCE_PACKAGES }}
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Guldr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/GuldrCore/Package.resolved') }}

      # Release compiles out everything behind #if DEBUG (previews, the design system gallery), so code
      # that only builds in Debug fails here instead of at archive time. Build only: no tests, no signing.
      # It needs no simulator, so it runs here, in parallel with the test job. arm64 only: the
      # generic destination would also compile x86_64, which no device or Apple silicon Mac runs.
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project Guldr.xcodeproj \
            -scheme Guldr \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -skipPackageUpdates \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Only runs on main write the cache. Pull requests just read it, so a PR can never change
      # what another run restores.
      - name: Save Swift packages
        if: github.event_name == 'push' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SOURCE_PACKAGES }}
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Guldr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/GuldrCore/Package.resolved') }}

  # The job id is the required status check in the main ruleset. Do not rename it.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Starts the boot and returns; the simulator boots while the app compiles.
      - name: Prepare simulator
        id: simulator
        uses: ./.github/actions/prepare-simulator
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          simulator-name: ${{ env.SIMULATOR_NAME }}

      - name: Restore Swift packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SOURCE_PACKAGES }}
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Guldr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/GuldrCore/Package.resolved') }}

      # Built for any simulator, so it does not wait for the boot. arm64 only, the simulator's
      # architecture; the generic destination would also compile x86_64.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Guldr.xcodeproj \
            -scheme Guldr \
            -destination "generic/platform=iOS Simulator" \
            -only-testing:GuldrTests \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -skipPackageUpdates \
            -enableCodeCoverage NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Wait for simulator
        uses: ./.github/actions/wait-for-simulator
        with:
          udid: ${{ steps.simulator.outputs.udid }}
          project: Guldr.xcodeproj
          scheme: Guldr
          cloned-source-packages-path: ${{ env.SOURCE_PACKAGES }}

      - name: Run unit tests
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Guldr.xcodeproj \
            -scheme Guldr \
            -destination "platform=iOS Simulator,id=$UDID,arch=arm64" \
            -destination-timeout 120 \
            -only-testing:GuldrTests \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -skipPackageUpdates \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify --renderer github-actions

      # Guards against a green check that ran nothing (e.g. a test target dropped from the scheme).
      - name: Verify tests ran
        run: |
          set -euo pipefail
          summary="$(xcrun xcresulttool get test-results summary --path TestResults.xcresult)"
          total="$(echo "$summary" | jq '.totalTestCount')"
          passed="$(echo "$summary" | jq '.passedTests')"
          failed="$(echo "$summary" | jq '.failedTests')"
          skipped="$(echo "$summary" | jq '.skippedTests')"
          {
            echo "### Unit tests"
            echo "| Total | Passed | Failed | Skipped |"
            echo "|---|---|---|---|"
            echo "| $total | $passed | $failed | $skipped |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -eq 0 ]; then
            echo "::error::No tests were executed."
            exit 1
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
