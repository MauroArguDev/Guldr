name: UI tests

# UI tests are slow and sensitive to simulator performance on shared runners, so they
# are kept out of the required PR check. They run weekly, on demand, and locally before
# every release (see docs/WORKFLOW.md).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ui-tests
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"
  SIMULATOR_NAME: "iPhone 17"
  NSUnbufferedIO: "YES"

jobs:
  ui-tests:
    name: ui-tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare simulator
        id: simulator
        uses: ./.github/actions/prepare-simulator
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          simulator-name: ${{ env.SIMULATOR_NAME }}

      - name: Build for testing
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Guldr.xcodeproj \
            -scheme Guldr \
            -destination "id=$UDID" \
            -only-testing:GuldrUITests \
            -derivedDataPath DerivedData \
            -enableCodeCoverage NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run UI tests
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Guldr.xcodeproj \
            -scheme Guldr \
            -destination "id=$UDID" \
            -only-testing:GuldrUITests \
            -derivedDataPath DerivedData \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -resultBundlePath UITestResults.xcresult \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore
