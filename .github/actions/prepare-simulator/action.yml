name: Prepare simulator
description: >
  Select a pinned Xcode and start booting an iPhone simulator on the newest installed iOS runtime,
  without waiting for it. Pair with wait-for-simulator before running tests.

inputs:
  xcode-version:
    description: Xcode version installed on the runner image, e.g. "26.6".
    required: true
  simulator-name:
    description: Simulator device name, e.g. "iPhone 17".
    required: true

outputs:
  udid:
    description: UDID of the simulator being booted, used as the xcodebuild destination.
    value: ${{ steps.boot.outputs.udid }}

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      env:
        XCODE_VERSION: ${{ inputs.xcode-version }}
      run: |
        set -euo pipefail
        sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
        xcodebuild -version

    # A cold boot takes about 2.5 minutes on macos-26. Starting it in the background lets the
    # build run meanwhile; wait-for-simulator boots the device itself if this attempt failed.
    - name: Start booting simulator
      id: boot
      shell: bash
      env:
        SIMULATOR_NAME: ${{ inputs.simulator-name }}
      run: |
        set -euo pipefail
        udid="$(xcrun simctl list devices available -j | jq -r --arg name "$SIMULATOR_NAME" '
          [.devices | to_entries[]
            | select(.key | test("SimRuntime\\.iOS-"))
            | (.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)")) as $version
            | .value[]
            | select(.name == $name)
            | {udid, order: [($version.major | tonumber), ($version.minor | tonumber)]}]
          | sort_by(.order) | last | .udid // empty')"
        if [ -z "$udid" ]; then
          echo "::error::No available '$SIMULATOR_NAME' simulator found."
          xcrun simctl list devices available
          exit 1
        fi
        echo "Booting $SIMULATOR_NAME ($udid) in the background"
        nohup xcrun simctl boot "$udid" > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &
        echo "udid=$udid" >> "$GITHUB_OUTPUT"
