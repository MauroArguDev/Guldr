name: Prepare simulator
description: Select a pinned Xcode and boot an iPhone simulator on the newest installed iOS runtime.

inputs:
  xcode-version:
    description: Xcode version installed on the runner image, e.g. "26.6".
    required: true
  simulator-name:
    description: Simulator device name, e.g. "iPhone 17".
    required: true
  project:
    description: Xcode project used to confirm the simulator is a valid destination.
    required: true
  scheme:
    description: Scheme used to confirm the simulator is a valid destination.
    required: true

outputs:
  udid:
    description: UDID of the booted simulator, used as the xcodebuild destination.
    value: ${{ steps.boot.outputs.udid }}

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      env:
        XCODE_VERSION: ${{ inputs.xcode-version }}
      run: |
        set -euo pipefail
        sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
        xcodebuild -version

    # Booting before xcodebuild runs keeps the cold-boot cost in its own, measurable step
    # and lets the build start against a simulator that is already up.
    - name: Boot simulator
      id: boot
      shell: bash
      env:
        SIMULATOR_NAME: ${{ inputs.simulator-name }}
      run: |
        set -euo pipefail
        udid="$(xcrun simctl list devices available -j | jq -r --arg name "$SIMULATOR_NAME" '
          [.devices | to_entries[]
            | select(.key | test("SimRuntime\\.iOS-"))
            | (.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)")) as $version
            | .value[]
            | select(.name == $name)
            | {udid, order: [($version.major | tonumber), ($version.minor | tonumber)]}]
          | sort_by(.order) | last | .udid // empty')"
        if [ -z "$udid" ]; then
          echo "::error::No available '$SIMULATOR_NAME' simulator found."
          xcrun simctl list devices available
          exit 1
        fi
        echo "Booting $SIMULATOR_NAME ($udid)"
        # -b boots the device if needed and waits until it has finished booting.
        xcrun simctl bootstatus "$udid" -b
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    # On a cold runner CoreSimulator can report the device as booted before xcodebuild
    # lists it as a destination, and xcodebuild then fails with "Unable to find a device".
    # Wait until the scheme's destinations include the simulator before building.
    - name: Wait for xcodebuild to see the simulator
      shell: bash
      env:
        UDID: ${{ steps.boot.outputs.udid }}
        PROJECT: ${{ inputs.project }}
        SCHEME: ${{ inputs.scheme }}
      run: |
        set -euo pipefail
        for attempt in $(seq 1 10); do
          destinations="$(xcodebuild -showdestinations -project "$PROJECT" -scheme "$SCHEME" 2>/dev/null || true)"
          if grep -q "id:$UDID" <<< "$destinations"; then
            echo "Simulator $UDID is available to xcodebuild (attempt $attempt)."
            exit 0
          fi
          echo "Simulator not listed yet (attempt $attempt/10); retrying in 15 s."
          sleep 15
        done
        echo "::error::xcodebuild never listed simulator $UDID as a destination."
        xcrun simctl list devices booted
        exit 1
