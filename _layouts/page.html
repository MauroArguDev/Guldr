<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title == site.title %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{ '/assets/icon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
  <style>
    /* Values from docs/design/tokens.json on main. */
    :root {
      --app-background: #F7F4EE;
      --surface: #FFFFFF;
      --text-primary: #141312;
      --text-secondary: #6B665E;
      --hairline: #E3DDD1;
      --gold: #82642B;
      --gold-fill: #C8A96A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --app-background: #111111;
        --surface: #1B1A18;
        --text-primary: #F2EEE6;
        --text-secondary: #9C968C;
        --hairline: #2C2A27;
        --gold: #C8A96A;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--app-background);
      color: var(--text-primary);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    .page { max-width: 680px; margin: 0 auto; padding: 24px 20px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
             padding-bottom: 20px; border-bottom: 1px solid var(--hairline); }
    .brand { display: inline-flex; color: var(--text-primary); }
    .brand svg { height: 30px; width: auto; display: block; }
    nav { display: flex; gap: 20px; font-size: 15px; font-weight: 500; }
    nav a { color: var(--text-secondary); text-decoration: none; }
    nav a[aria-current="page"], nav a:hover { color: var(--gold); }
    main { padding-top: 8px; }
    h1, h2 { font-family: ui-serif, "New York", Georgia, serif; font-weight: 400; line-height: 1.2; }
    h1 { font-size: 34px; margin: 32px 0 8px; }
    h2 { font-size: 24px; margin: 36px 0 8px; }
    h3 { font-size: 17px; font-weight: 600; margin: 28px 0 4px; }
    p, ul { margin: 8px 0 12px; }
    ul { padding-left: 22px; }
    li { margin: 4px 0; }
    a { color: var(--gold); text-underline-offset: 3px; }
    strong { font-weight: 600; }
    .lead { font-family: ui-serif, "New York", Georgia, serif; font-size: 24px; color: var(--gold); margin-top: 32px; }
    footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--hairline);
             font-size: 13px; color: var(--text-secondary); }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="{{ '/' | relative_url }}">{% include wordmark.svg %}</a>
      <nav aria-label="Pages">
        <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
        <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      © 2026 Mauricio Argumedo · <a href="mailto:argudev@icloud.com">argudev@icloud.com</a>
    </footer>
  </div>
</body>
</html>
